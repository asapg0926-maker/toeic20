<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="토익20">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>아침 20분 토익</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Outfit:wght@500;700;800&display=swap">
<style>
/* Layout: one-column phone app, max 460px; home = header / streak / two big buttons / OMR-bubble calendar */
:root{
  --bg:#ffffff; --surface:#fbf8f5; --line:#efe8e1; --ink:#221c17; --muted:#8a7f76;
  --accent:#ff7a1a; --accent-deep:#e9630a; --accent-soft:#fff1e6; --ok:#2f9e6a; --bad:#d9483b;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Outfit","IBM Plex Sans KR",system-ui,sans-serif;
  --r:18px; color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;padding-inline:16px;padding-block:12px 28px}
.app{max-width:460px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* ---------- home ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:6px}
.brand small{display:block;color:var(--muted);font-size:13px}
.brand b{font-size:20px;letter-spacing:-.02em}
.dday{text-align:right;line-height:1.1}
.dday .num{font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-.02em}
.dday small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.streak{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px 18px;background:var(--accent-soft);border-radius:var(--r)}
.streak svg{flex:none}
.streak .big{font-family:var(--f-num);font-size:34px;font-weight:800;line-height:1;color:var(--accent-deep)}
.streak .big span{font-family:var(--f-body);font-size:15px;font-weight:700;margin-left:2px}
.streak p{margin:2px 0 0;font-size:13px;color:#9a5a2a}
.mainbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.mbtn{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;
  aspect-ratio:1/1.05;max-width:100%;padding:18px;border-radius:24px;background:var(--accent);color:#fff;box-shadow:0 10px 24px -12px rgba(233,99,10,.7);transition:transform .12s}
.mbtn:active{transform:scale(.97)}
.mbtn .lbl{font-size:30px;font-weight:700;letter-spacing:-.03em}
.mbtn .sub{font-size:13px;opacity:.92;line-height:1.35}
.mbtn .min{position:absolute;top:16px;right:16px;font-family:var(--f-num);font-weight:700;font-size:13px;background:rgba(255,255,255,.22);padding:2px 9px;border-radius:99px}
.mbtn.done{background:#fff;color:var(--accent-deep);box-shadow:inset 0 0 0 2px var(--accent)}
.mbtn.done .min{background:var(--accent-soft)}
.cal{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:var(--r)}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead b{font-size:16px}
.calhead button{width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;margin-top:10px;text-align:center}
.grid .wd{font-size:11px;color:var(--muted);padding-bottom:2px}
.grid .wd:first-child{color:var(--bad)}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.bub{width:26px;height:26px;border-radius:50%;border:1.6px solid #e3d8ce;position:relative;overflow:hidden;display:grid;place-items:center}
.bub.v::before,.bub.l::before{content:"";position:absolute;top:0;bottom:0;width:50%;background:var(--accent)}
.bub.v::before{left:0}.bub.l::before{right:0}
.bub.vl{background:var(--accent);border-color:var(--accent)}
.bub.vl svg{display:block}
.bub svg{display:none}
.day.today{color:var(--accent-deep);font-weight:700}
.day.today .bub{border-color:var(--accent);border-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .bub{width:16px;height:16px;border-width:1.3px}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;min-width:0;padding:10px 12px;background:var(--surface);border-radius:12px}
.stat small{display:block;font-size:11px;color:var(--muted)}
.stat b{font-family:var(--f-num);font-size:17px}
.foot{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}
.foot button{color:var(--muted);text-decoration:underline;font-size:12px}
/* ---------- shared screen chrome ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);font-size:20px;display:grid;place-items:center;flex:none}
.bar h2{margin:0;font-size:18px;letter-spacing:-.02em;flex:1;min-width:0}
.steps{display:flex;gap:6px}
.steps i{width:22px;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.past{background:#ffc9a3}
.phase{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:6px 0 12px}
.phase b{font-size:15px}
.timer{font-family:var(--f-num);font-weight:700;font-size:22px;color:var(--accent-deep)}
.timer.over{color:var(--ok)}
.card{position:relative;min-height:290px;padding:26px 22px 22px;border-radius:24px;background:var(--bg);border:1.5px solid var(--line);box-shadow:0 14px 30px -22px rgba(60,30,10,.35);display:flex;flex-direction:column;gap:14px;user-select:none}
.card .tag{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface);color:var(--muted)}
.card .tag.rv{background:#fde8e5;color:var(--bad)}
.card .tag.co{background:#e8f4ee;color:var(--ok)}
.word{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;word-break:break-word;display:flex;align-items:center;gap:10px}
.word.co{font-size:26px}
.spk{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.senses{display:flex;flex-direction:column;gap:8px}
.sense{display:flex;gap:10px;align-items:baseline;font-size:17px}
.pos{flex:none;font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);padding:2px 8px;border-radius:6px;min-width:38px;text-align:center}
.cover{flex:1;display:grid;place-items:center;border-radius:14px;background:var(--surface);color:var(--muted);font-size:15px;min-height:110px}
.counter{margin-top:auto;font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:52px;border-radius:16px;font-weight:700;font-size:16px;background:var(--surface);display:grid;place-items:center;padding:0 14px}
.btn.pri{background:var(--accent);color:#fff}
.btn.ok{background:#e8f4ee;color:var(--ok)}
.btn.no{background:#fde8e5;color:var(--bad)}
.btn:disabled{opacity:.4}
.btn.sm{min-height:44px;font-size:14px;flex:none}
.note{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:#8a4a1a;font-size:14px}
.note.ok{background:#e8f4ee;color:#1f6b47}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
/* quiz */
.q{padding:18px;border:1.5px solid var(--line);border-radius:20px}
.q p{margin:0 0 12px;font-size:16px;line-height:1.6}
.q p .no{font-family:var(--f-num);font-weight:800;color:var(--accent);margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface);font-size:16px}
.opt b{font-family:var(--f-num);color:var(--muted);flex:none}
.opt.right{background:#e8f4ee;color:#1f6b47;box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.wrong{background:#fde8e5;color:#9b2d23;box-shadow:inset 0 0 0 1.5px var(--bad)}
.qs{display:flex;flex-direction:column;gap:12px}
.ansline{margin-top:10px;font-size:14px;font-weight:700}
/* summary list */
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.li{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14px}
.li b{flex:none;min-width:0}
.li span{color:var(--muted);min-width:0}
/* listening */
.player{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:#1d1713}
.player > div,.player iframe{position:absolute;inset:0;width:100%;height:100%}
.ring{display:flex;align-items:center;gap:16px;margin:16px 0 4px}
.ring svg{flex:none}
.ring .t{font-family:var(--f-num);font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.ring small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cbtn{min-height:56px;border-radius:14px;background:var(--surface);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.cbtn small{font-weight:500;font-size:11px;color:var(--muted)}
.cbtn.main{background:var(--accent);color:#fff}
.cbtn.on{background:var(--accent-soft);color:var(--accent-deep);box-shadow:inset 0 0 0 1.5px var(--accent)}
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;margin-top:8px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-family:var(--f-num);font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--accent-deep);box-shadow:0 2px 8px -4px rgba(0,0,0,.25)}
.pos-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.fallback{padding:18px;border-radius:20px;background:var(--surface)}
.fallback p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.fallback .big{font-family:var(--f-num);font-size:28px;font-weight:800}
.ytlink{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;margin-top:10px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stepper button{flex:1;min-width:56px;min-height:40px;border-radius:10px;background:#fff;font-family:var(--f-num);font-weight:700;font-size:13px;box-shadow:inset 0 0 0 1px var(--line)}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(34,28,23,.45);display:grid;place-items:center;padding:24px;z-index:20}
.modal .box{width:100%;max-width:360px;background:#fff;border-radius:24px;padding:26px 22px;text-align:center}
.modal h3{margin:8px 0 6px;font-size:22px}
.modal p{margin:0 0 16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--ink);background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <!-- HOME -->
  <section id="home">
    <div class="top">
      <div class="brand"><small id="today-lbl"></small><b>아침 20분 토익</b></div>
      <div class="dday"><div class="num" id="dday">D-0</div><small>11월 15일 시험</small></div>
    </div>
    <div class="streak">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4c2 6 9 9 9 18a9 9 0 0 1-18 0c0-4 2-7 4-9 0 3 1 5 3 6 0-6 0-10 2-15z" fill="#ff7a1a"/><path d="M20 22c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 1 1 2 1 2 0-3 0-4 1-6z" fill="#ffd2ad"/></svg>
      <div><div class="big" id="streak">0<span>일 연속</span></div><p id="streak-msg">오늘 첫 공부를 시작해 보세요</p></div>
    </div>
    <div class="mainbtns">
      <button class="mbtn" id="go-vocab"><span class="min">10분</span><span class="lbl">단어</span><span class="sub" id="vocab-sub">Day 1</span></button>
      <button class="mbtn" id="go-listen"><span class="min">10분</span><span class="lbl">듣기</span><span class="sub" id="listen-sub">영상 1</span></button>
    </div>
    <div class="stats">
      <div class="stat"><small>공부한 날</small><b id="st-days">0</b></div>
      <div class="stat"><small>단어 진도</small><b id="st-vocab">0/30</b></div>
      <div class="stat"><small>복습 대기</small><b id="st-rv">0</b></div>
    </div>
    <div class="cal">
      <div class="calhead"><button id="cal-prev" aria-label="이전 달">‹</button><b id="cal-title"></b><button id="cal-next" aria-label="다음 달">›</button></div>
      <div class="grid" id="cal-grid"></div>
      <div class="legend">
        <span><i class="bub v"></i>단어</span><span><i class="bub l"></i>듣기</span>
        <span><i class="bub vl"><svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 6.5l2.6 2.5L10 3.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></i>둘 다</span>
      </div>
    </div>
    <div class="foot"><span id="save-lbl">기록은 자동 저장돼요</span> · <button id="open-backup">백업</button></div>
  </section>

  <!-- VOCAB -->
  <section id="vocab" hidden>
    <div class="bar"><button class="back" data-home aria-label="홈으로">‹</button><h2 id="v-title">Day 1</h2><div class="steps" id="v-steps"><i></i><i></i><i></i><i></i></div></div>
    <div id="v-body"></div>
  </section>

  <!-- LISTEN -->
  <section id="listen" hidden>
    <div class="bar"><button class="back" data-home aria-label="홈으로">‹</button><h2>듣기 10분</h2><span class="muted" id="l-vid" style="font-size:13px"></span></div>
    <div id="l-embed">
      <div class="player"><div id="yt"></div></div>
      <div class="pos-line"><span id="l-pos">0:00</span><span id="l-ab"></span></div>
    </div>
    <div id="l-fallback" class="fallback" hidden>
      <p>영상 플레이어를 불러오지 못해서 유튜브에서 재생해요. 타이머는 여기서 켜 두세요.</p>
      <div class="muted" style="font-size:13px">이어 들을 위치</div>
      <div class="big" id="fb-pos">0:00</div>
      <a class="ytlink" id="fb-link" href="#" target="_blank" rel="noopener">▶ 유튜브에서 이어 듣기</a>
      <div class="muted" style="font-size:13px;margin-top:14px">다 듣고 나서 멈춘 위치로 맞춰 주세요</div>
      <div class="stepper"><button data-adj="-60">-1분</button><button data-adj="-10">-10초</button><button data-adj="10">+10초</button><button data-adj="60">+1분</button></div>
      <div class="stepper"><button id="fb-next">다음 영상으로</button></div>
    </div>
    <div class="ring">
      <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="#efe8e1" stroke-width="7"/><circle id="l-arc" cx="32" cy="32" r="27" fill="none" stroke="#ff7a1a" stroke-width="7" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6" transform="rotate(-90 32 32)"/></svg>
      <div><div class="t" id="l-time">10:00</div><small id="l-state">시작 버튼을 누르면 타이머가 돌아가요</small></div>
    </div>
    <div class="ctrls" id="l-ctrls">
      <button class="cbtn" id="b-10">−10<small>초</small></button>
      <button class="cbtn" id="b-5">−5<small>초</small></button>
      <button class="cbtn main" id="b-play">시작</button>
      <button class="cbtn" id="b-ab">A-B<small>구간 반복</small></button>
    </div>
    <div class="seg" id="l-speed"><button data-r="0.75">0.75×</button><button data-r="1" class="on">1×</button><button data-r="1.25">1.25×</button></div>
    <div class="hint">되감기·반복·생각하는 시간도 공부 시간에 포함돼요. 일시정지하면 타이머도 멈춰요.</div>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="box" id="modal-box"></div></div>

  $('#cal-title').textContent = calY + '년 ' + (calM + 1) + '월';
  const first = new Date(calY, calM, 1).getDay(), days = new Date(calY, calM + 1, 0).getDate(), t = today();
  let h = '일월화수목금토'.split('').map(x => '<div class="wd">' + x + '</div>').join('');
  for (let i = 0; i < first; i++) h += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const k = calY + '-' + pad(calM + 1) + '-' + pad(d), e = S.h[k] || {};
    const cls = e.v && e.l ? 'vl' : e.v ? 'v' : e.l ? 'l' : '';
    const lbl = e.v && e.l ? '단어, 듣기 완료' : e.v ? '단어 완료' : e.l ? '듣기 완료' : '';
    h += '<div class="day' + (k === t ? ' today' : '') + '"' + (lbl ? ' aria-label="' + d + '일 ' + lbl + '"' : '') + '><span class="bub ' + cls + '">' + CHECK + '</span>' + (k === '2026-11-15' ? '시험' : d) + '</div>';
  }

}
$('#cal-prev').onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); };
$('#cal-next').onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); };

/* ---------------- vocab flow ---------------- */
let V = null;            // in-memory session (mirrors S.vs)
let stepTimer = null, stepEnd = 0;
function stopStepTimer() { clearInterval(stepTimer); stepTimer = null; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildSession() {
  const n = S.vc + 1, d = dayOf(n);
  const todays = dayKeys(d);
  const due = [...new Set(S.rv.filter(x => x.due <= n).map(x => x.k))].filter(k => !todays.includes(k));
  // spread review words evenly through today's cards
  const cards = todays.slice(0, 25); const colls = todays.slice(25);
  shuffle(due).forEach((k, i) => cards.splice(Math.min(cards.length, Math.round((i + 1) * (cards.length + 1) / (due.length + 1))), 0, k));
  return { date: today(), n, day: d, step: n > 1 ? 1 : 2, idx: 0, cards: cards.concat(colls), due, res: {}, qa: [null, null, null], rev: false };
}
function openVocab() {
  unlockAudio();
  if (vocabDoneToday()) {           // already done: free review of today's Day
    const d = dayOf(S.vc);
    V = { date: today(), n: S.vc, day: d, step: 2, idx: 0, cards: dayKeys(d), due: [], res: {}, qa: [null, null, null], rev: true };
  } else {
    if (!S.vs || S.vs.date !== today() || S.vs.n !== S.vc + 1) { S.vs = buildSession(); save(); }
    V = S.vs;
  }
  show('vocab'); renderVocab(true);
}
$('#go-vocab').onclick = openVocab;
function setStep(step) { V.step = step; V.idx = 0; if (!V.rev) save(); renderVocab(true); }
function renderSteps() {
  const ii = document.querySelectorAll('#v-steps i');
  ii.forEach((el, k) => { el.className = k + 1 === V.step ? 'on' : k + 1 < V.step ? 'past' : ''; });
  $('#v-steps').hidden = V.rev;
}
function startStepTimer(sec, onEnd) {
  stopStepTimer(); stepEnd = Date.now() + sec * 1000; let fired = false;
  const tick = () => { const left = (stepEnd - Date.now()) / 1000; const el = $('#v-timer'); if (!el) return stopStepTimer();
    if (left <= 0) { el.textContent = '완료'; el.classList.add('over'); if (!fired) { fired = true; stopStepTimer(); onEnd(); } } else el.textContent = mmss(Math.ceil(left)); };
  tick(); stepTimer = setInterval(tick, 250);
}
function senseHtml(it) {
  return '<div class="senses">' + it.senses.map(s => '<div class="sense">' + (s[0] ? '<span class="pos">' + (POSN[s[0]] || s[0]) + '.</span>' : '') + '<span>' + esc(s[1]) + '</span></div>').join('') + '</div>';
}
function cardHtml(it, opts) {
  const isRv = V.due.includes(it.key);
  const tag = isRv ? '<span class="tag rv">복습 · Day ' + it.day + '</span>' : it.type === 'c' ? '<span class="tag co">기출 Collocation</span>' : '<span class="tag">기출 단어</span>';
  return '<div class="card" id="card" role="button" tabindex="0" aria-label="눌러서 발음 듣기">' + tag +
    '<div class="word' + (it.type === 'c' ? ' co' : '') + '"><span>' + esc(it.word) + '</span><span class="spk" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#e9630a"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#e9630a" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></div>' +
    (opts.hide ? '<div class="cover" id="reveal">뜻 가림 · 떠올려 본 뒤 눌러서 확인</div>' : senseHtml(it)) +
    '<div class="counter num">' + opts.count + '</div></div>';
}
function bindCard(it, onSwipe) {
  const c = $('#card'); if (!c) return;
  c.addEventListener('click', e => { if (e.target.closest('#reveal')) return; speak(it.word); });
  c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); speak(it.word); } });
  let x0 = null;
  c.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  c.addEventListener('touchend', e => { if (x0 == null || !onSwipe) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) onSwipe(dx < 0 ? 1 : -1); });
}
function renderVocab(fresh) {
  renderSteps();
  $('#v-title').textContent = (V.rev ? '다시 보기 · ' : '') + 'Day ' + V.day;
  const body = $('#v-body');
  if (V.rev) return renderLearn(body, fresh, true);
  if (V.step === 1) return renderQuick(body, fresh);
  if (V.step === 2) return renderLearn(body, fresh, false);
  if (V.step === 3) return renderTest(body);
  if (V.step === 4) return renderQuiz(body);
  if (V.step === 5) return renderDone(body);
}
/* ① yesterday quick review */
function renderQuick(body, fresh) {
  const keys = dayKeys(dayOf(V.n - 1));
  const i = Math.min(V.idx, keys.length - 1), it = item(keys[i]);
  body.innerHTML = '<div class="phase"><b>① 어제 단어 빠른 복습 <span class="muted">Day ' + it.day + '</span></b><span class="timer" id="v-timer">1:00</span></div>' +
    cardHtml(it, { count: (i + 1) + ' / ' + keys.length }) +
    '<div class="row"><button class="btn" id="q-prev"' + (i === 0 ? ' disabled' : '') + '>이전</button><button class="btn pri" id="q-next">' + (i === keys.length - 1 ? '오늘 단어로' : '다음') + '</button></div>' +
    '<div class="row"><button class="btn sm" id="q-skip" style="flex:1">복습 건너뛰고 오늘 단어 시작</button></div>';
  bindCard(it, dir => go(dir));
  const go = dir => { const j = V.idx + dir; if (j < 0) return; if (j >= keys.length) return setStep(2); V.idx = j; renderQuick(body, false); };
  $('#q-prev').onclick = () => go(-1); $('#q-next').onclick = () => go(1); $('#q-skip').onclick = () => setStep(2);
  if (fresh) startStepTimer(REVIEW_SEC, () => { chime(); toast('1분 복습 끝! 오늘 단어로 넘어가요'); setTimeout(() => { if (V && V.step === 1) setStep(2); }, 900); });
  else { const el = $('#v-timer'); const left = (stepEnd - Date.now()) / 1000; if (el) el.textContent = left > 0 ? mmss(Math.ceil(left)) : '완료'; }
}
/* ② learn */
function renderLearn(body, fresh, rev) {
  const keys = V.cards, i = Math.min(V.idx, keys.length - 1), it = item(keys[i]);
  const nRv = V.due.length;
  body.innerHTML = '<div class="phase"><b>' + (rev ? '오늘 단어 다시 보기' : '② 오늘 단어 외우기') + (nRv ? ' <span class="muted">복습 ' + nRv + '개 포함</span>' : '') + '</b>' + (rev ? '' : '<span class="timer" id="v-timer">5:00</span>') + '</div>' +
    cardHtml(it, { count: (i + 1) + ' / ' + keys.length }) +
    '<div class="row"><button class="btn" id="l-prev"' + (i === 0 ? ' disabled' : '') + '>이전</button><button class="btn' + (i === keys.length - 1 ? ' pri' : '') + '" id="l-next">' + (i === keys.length - 1 ? (rev ? '처음으로' : '셀프 테스트') : '다음') + '</button></div>' +
    (rev ? '' : '<div class="row"><button class="btn pri" id="l-test">셀프 테스트 시작</button></div>') +
    '<div class="hint">카드를 누르면 발음이 나와요 · 좌우로 넘길 수 있어요</div>' + (V.timeUp && !rev ? '<div class="note">5분이 끝났어요. 준비되면 셀프 테스트로 넘어가세요.</div>' : '');
  const go = dir => { let j = V.idx + dir; if (j < 0) return; if (j >= keys.length) { if (rev) j = 0; else return setStep(3); } V.idx = j; if (!rev) save(); renderLearn(body, false, rev); };

  if (!rev) {
    $('#l-test').onclick = () => setStep(3);
    if (fresh) { V.timeUp = false; startStepTimer(LEARN_SEC, () => { chime(); V.timeUp = true; toast('5분 끝! 셀프 테스트를 시작해요'); renderLearn(body, false, false); }); }
    else { const el = $('#v-timer'); const left = (stepEnd - Date.now()) / 1000; if (el) { el.textContent = left > 0 ? mmss(Math.ceil(left)) : '완료'; if (left <= 0) el.classList.add('over'); } }
  }
}
/* ③ self test */
function renderTest(body) {
  stopStepTimer();
  const keys = V.cards, i = V.idx;
  if (i >= keys.length) return renderTestSummary(body);
  const it = item(keys[i]);
  body.innerHTML = '<div class="phase"><b>③ 셀프 테스트</b><span class="muted num">' + Object.values(V.res).filter(x => x === 0).length + '개 몰랐음</span></div>' +
    cardHtml(it, { count: (i + 1) + ' / ' + keys.length, hide: !V.shown }) +
    (V.shown ? '<div class="row"><button class="btn no" id="t-no">몰랐음</button><button class="btn ok" id="t-yes">맞혔음</button></div>'
             : '<div class="row"><button class="btn pri" id="t-show">뜻 보기</button></div>');
  bindCard(it, null);
  const answer = ok => { V.res[it.key] = ok ? 1 : 0; V.idx++; V.shown = false; save(); renderTest(body); };
  if (V.shown) { $('#t-no').onclick = () => answer(false); $('#t-yes').onclick = () => answer(true); }
  else { const rv = () => { V.shown = true; renderTest(body); }; $('#t-show').onclick = rv; $('#reveal').onclick = rv; }

  body.innerHTML = '<div class="phase"><b>③ 셀프 테스트 결과</b><span class="num">' + (V.cards.length - wrong.length) + ' / ' + V.cards.length + '</span></div>' +
    (wrong.length ? '<div class="note">몰랐던 ' + wrong.length + '개는 공부한 날 기준 3일 뒤, 7일 뒤에 오늘 단어에 섞여서 다시 나와요.</div>' +
      '<div class="list">' + wrong.map(k => { const it = item(k); return '<div class="li"><b>' + esc(it.word) + '</b><span>' + esc(it.senses.map(s => s[1]).join(' / ')) + '</span></div>'; }).join('') + '</div>'
      : '<div class="note ok">전부 맞혔어요!</div>') +

/* ④ quiz */

      q[1].map((o, k) => { let c = ''; if (a != null) { if (k === q[2]) c = ' right'; else if (k === a) c = ' wrong'; }

      '</div>' + (a != null ? '<div class="ansline" style="color:' + (a === q[2] ? 'var(--ok)' : a === -1 ? 'var(--accent-deep)' : 'var(--bad)') + '">' + (a === q[2] ? '정답!' : (a === -1 ? '' : '오답 · ') + '정답은 (' + 'ABCD'[q[2]] + ') ' + esc(q[1][q[2]])) + '</div>'

/* ---------------- listening ---------------- */
let player = null, ytReady = false, ytFailed = false, ytLoading = false;
let running = false, lastTick = 0, tickT = null, saveT = 0, ab = { a: null, b: null }, pendingPlay = false;
function lsec() { return S.lt.d === today() ? S.lt.s : 0; }
function loadYT() {
  if (ytLoading) return; ytLoading = true;
  const failTimer = setTimeout(() => { if (!ytReady) useFallback(); }, 10000);
  window.onYouTubeIframeAPIReady = () => {
    try {
      player = new YT.Player('yt', {
        videoId: VIDEOS[S.lv.i], host: 'https://www.youtube.com',
        playerVars: { start: Math.floor(S.lv.t), playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => { clearTimeout(failTimer); ytReady = true; if (ytFailed) restoreEmbed(); try { player.setPlaybackRate(S.rate || 1); } catch (e) {} if (pendingPlay) { pendingPlay = false; player.playVideo(); } },
          onStateChange: e => { if (e.data === 0) nextVideo(true); },
          onError: () => { toast('영상을 불러오지 못했어요. 인터넷 연결을 확인해 주세요'); }
        }
      });
    } catch (e) { useFallback(); }
  };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { clearTimeout(failTimer); useFallback(); }; document.head.appendChild(s);
}
function useFallback() {
  if (ytReady) return; ytFailed = true;
  $('#l-embed').hidden = true; $('#l-fallback').hidden = false;
  ['#b-5', '#b-10', '#b-ab'].forEach(s => $(s).hidden = true); $('#l-speed').hidden = true;
  $('#l-ctrls').style.gridTemplateColumns = '1fr';
  renderFallback();
}
function restoreEmbed() {
  ytFailed = false; $('#l-embed').hidden = false; $('#l-fallback').hidden = true;
  ['#b-5', '#b-10', '#b-ab'].forEach(s => $(s).hidden = false); $('#l-speed').hidden = false;
  $('#l-ctrls').style.gridTemplateColumns = '';
  try { player.cueVideoById(VIDEOS[S.lv.i], S.lv.t); } catch (e) {}
}
function renderFallback() {
  $('#fb-pos').textContent = '영상 ' + (S.lv.i + 1) + ' · ' + mmss(S.lv.t);
  $('#fb-link').href = 'https://youtu.be/' + VIDEOS[S.lv.i] + '?t=' + Math.floor(S.lv.t);
}
document.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => { S.lv.t = Math.max(0, S.lv.t + +b.dataset.adj); save(); renderFallback(); renderListenInfo(); });
$('#fb-next').onclick = () => { nextVideo(false); renderFallback(); };
function curTime() { try { return ytReady ? player.getCurrentTime() || 0 : S.lv.t; } catch (e) { return S.lv.t; } }
function nextVideo(auto) {
  S.lv.i++; S.lv.t = 0;
  if (S.lv.i >= VIDEOS.length) { S.lv.i = 0; toast('영상을 모두 들었어요. 1번 영상부터 다시 시작해요'); }
  else if (auto) toast((S.lv.i + 1) + '번 영상으로 넘어가요');
  ab = { a: null, b: null }; save();
  if (ytReady) { if (running) player.loadVideoById(VIDEOS[S.lv.i], 0); else player.cueVideoById(VIDEOS[S.lv.i], 0); }
  renderListenInfo();
}
function renderListenInfo() {
  $('#l-vid').textContent = '영상 ' + (S.lv.i + 1) + ' / ' + VIDEOS.length;
  const left = Math.max(0, LISTEN_SEC - lsec());
  $('#l-time').textContent = mmss(left);
  $('#l-arc').setAttribute('stroke-dashoffset', (169.6 * left / LISTEN_SEC).toFixed(1));
  const done = (S.h[today()] || {}).l;
  $('#l-state').textContent = done && left === 0 ? '오늘 10분 완료 · 더 들어도 위치는 저장돼요' : running ? '공부 중 · 남은 시간' : lsec() ? '일시정지됨' : '시작 버튼을 누르면 타이머가 돌아가요';
  $('#b-play').textContent = running ? '일시정지' : lsec() && left > 0 ? '계속' : left === 0 ? '더 듣기' : '시작';
  $('#b-ab').classList.toggle('on', ab.a != null);
  $('#b-ab').innerHTML = ab.a == null ? 'A-B<small>구간 반복</small>' : ab.b == null ? 'B 지정<small>A ' + mmss(ab.a) + '</small>' : '반복 중<small>탭하면 해제</small>';
  $('#l-ab').textContent = ab.a != null && ab.b != null ? '구간 반복 ' + mmss(ab.a) + ' – ' + mmss(ab.b) : '';

}
function tick() {
  const now = Date.now(), dt = (now - lastTick) / 1000; lastTick = now;
  if (running) {
    const before = lsec();
    if (before < LISTEN_SEC) {
      S.lt = { d: today(), s: Math.min(LISTEN_SEC, before + dt) };
      if (S.lt.s >= LISTEN_SEC) return timeUp();
    }
  }
  if (ytReady) {
    const t = curTime(); $('#l-pos').textContent = mmss(t);
    if (ab.a != null && ab.b != null && t >= ab.b) player.seekTo(ab.a, true);
    if (running && t > 0) S.lv.t = t;
  }
  if (now - saveT > 3000) { saveT = now; save(); }
  renderListenInfo();
}
function timeUp() {
  running = false;
  if (ytReady) { try { player.pauseVideo(); S.lv.t = player.getCurrentTime(); } catch (e) {} }
  mark('l'); save(); renderListenInfo(); chime();
  const th = S.h[today()] || {};
  modal('<div style="font-size:44px">⏰</div><h3>듣기 10분 완료!</h3><p>' + (ytFailed ? '유튜브를 멈추고, 멈춘 위치를 맞춰 주세요.' : '영상 ' + (S.lv.i + 1) + ' · ' + mmss(S.lv.t) + '에서 멈췄어요. 내일 여기서 이어서 들어요.') + (th.v ? '<br>오늘 20분을 모두 채웠어요.' : '') + '</p>', null);
}
function setRunning(on) {
  running = on; lastTick = Date.now();
  if (ytReady) { try { on ? player.playVideo() : (player.pauseVideo(), S.lv.t = player.getCurrentTime()); } catch (e) {} }
  else if (on && !ytFailed) pendingPlay = true;
  save(); renderListenInfo();
}
$('#b-play').onclick = () => {
  unlockAudio();
  if (running) return setRunning(false);
  if (lsec() >= LISTEN_SEC) { // extra listening after the 10 minutes
    if (ytReady) player.playVideo(); toast('10분은 이미 채웠어요. 위치는 계속 저장돼요'); return;
  }
  setRunning(true);
};
const seekBy = d => { if (!ytReady) return; const t = Math.max(0, curTime() - d); player.seekTo(t, true); S.lv.t = t; tick(); };
$('#b-5').onclick = () => seekBy(5); $('#b-10').onclick = () => seekBy(10);
$('#b-ab').onclick = () => {
  if (!ytReady) return;
  const t = curTime();
  if (ab.a == null) { ab.a = t; toast('A 지점 ' + mmss(t) + ' · 끝낼 곳에서 한 번 더 누르세요'); }
  else if (ab.b == null) { if (t <= ab.a + 1) { toast('B는 A보다 뒤여야 해요'); return; } ab.b = t; player.seekTo(ab.a, true); toast('구간 반복 시작'); }
  else { ab = { a: null, b: null }; toast('구간 반복 해제'); }
  renderListenInfo();
};
document.querySelectorAll('#l-speed button').forEach(b => b.onclick = () => { S.rate = +b.dataset.r; if (ytReady) try { player.setPlaybackRate(S.rate); } catch (e) {} save(); renderListenInfo(); });
function openListen() {
  unlockAudio(); show('listen');
  if (!ytLoading) loadYT();
  else if (ytReady) { try { if (player.getVideoData().video_id !== VIDEOS[S.lv.i]) player.cueVideoById(VIDEOS[S.lv.i], S.lv.t); } catch (e) {} }
  if (ytFailed) renderFallback();
  clearInterval(tickT); lastTick = Date.now(); tickT = setInterval(tick, 250);
  renderListenInfo();
}
function leaveListen() {
  if (running) setRunning(false);
  clearInterval(tickT); tickT = null;
}
$('#go-listen').onclick = openListen;
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (ytReady && running) { try { S.lv.t = player.getCurrentTime(); } catch (e) {} } save(); } });
window.addEventListener('pagehide', save);

/* ---------------- backup ---------------- */
$('#open-backup').onclick = () => {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('#modal-box').innerHTML = '<h3>기록 백업</h3><p style="font-size:13px">아래 코드를 복사해 두면 다른 기기나 새 주소에서 기록을 이어갈 수 있어요.</p>' +
    '<textarea id="bk" aria-label="백업 코드">' + code + '</textarea>' +
    '<div class="row"><button class="btn" id="bk-copy">복사</button><button class="btn" id="bk-load">붙여넣은 코드 불러오기</button></div>' +
    '<div class="row"><button class="btn pri" id="bk-close">닫기</button></div>';
  $('#modal').hidden = false;
  $('#bk-copy').onclick = () => { const ta = $('#bk'); navigator.clipboard && navigator.clipboard.writeText(ta.value).then(() => toast('복사했어요'), () => { ta.select(); toast('코드를 길게 눌러 복사하세요'); }) || (ta.select()); };
  $('#bk-load').onclick = () => { try { const o = JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim())))); if (o.v !== 1) throw 0; adopt(o); save(); $('#modal').hidden = true; renderAll(); toast('기록을 불러왔어요'); } catch (e) { toast('코드를 읽지 못했어요. 전체를 붙여넣었는지 확인해 주세요'); } };
  $('#bk-close').onclick = () => { $('#modal').hidden = true; };
};

/* ---------------- boot ---------------- */
function renderAll() { if (!$('#home').hidden) renderHome(); }
renderHome();
connectCloud();
setInterval(() => { if (!$('#home').hidden) renderHome(); }, 60000);
})();
</script>

</body></html>
